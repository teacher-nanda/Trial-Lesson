<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Trial Lesson v2 (draft) — with Nanda</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#1B2A33;--paper:#FBF7F1;--coral:#F26B5B;--amber:#F2B138;--teal:#1F8A82;--violet:#6C63C9;--muted:#6B7A83;--line:#E4DCD1;--card:#fff;--ok:#1F8A5B;--bad:#C0392B}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
html{font-size:20px}body{font-family:'Outfit',system-ui,sans-serif;background:var(--paper);color:var(--ink);font-size:1.2rem;line-height:1.4;overflow:hidden}
h1,h2,h3{font-family:'Fraunces',Georgia,serif;font-weight:700;letter-spacing:-.01em}
button{font:inherit;color:inherit;cursor:pointer;border:none;background:none}
.app{display:grid;grid-template-rows:auto 1fr auto;height:100vh}
/* ---------- top bar ---------- */
.top{display:flex;align-items:center;gap:14px;padding:8px 18px;border-bottom:1px solid var(--line);background:#fff;flex-wrap:wrap}
.brand{font-family:'Fraunces',serif;font-weight:700;font-size:.95rem;line-height:1.1;margin-right:6px}
.brand small{display:block;font:600 .55rem 'Outfit';letter-spacing:.14em;text-transform:uppercase;color:var(--coral)}
.grp{display:flex;align-items:center;gap:8px}
.grp>span{font-size:.6rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.seg{display:flex;background:#F1EBE2;border-radius:999px;padding:3px}
.seg button{padding:5px 11px;border-radius:999px;font-weight:600;font-size:.78rem;color:var(--muted)}
.seg button.on{background:var(--ink);color:#fff}
.timer{margin-left:auto;display:flex;align-items:center;gap:10px;font-weight:700}
.timer .t{font-variant-numeric:tabular-nums;font-size:1.25rem;min-width:110px;text-align:right}
.timer .t.late{color:var(--coral)}
.timer button{padding:6px 14px;border-radius:999px;background:#F1EBE2;font-weight:600;font-size:.9rem}
/* ---------- stage ---------- */
.stage{position:relative;overflow:hidden}
.slide{position:absolute;inset:0;padding:24px 64px 14px;display:none;flex-direction:column;overflow:auto}
.slide.active{display:flex}
.kick{font:700 .85rem 'Outfit';letter-spacing:.16em;text-transform:uppercase;color:var(--coral);margin-bottom:6px}
h2{font-size:2.3rem;line-height:1.1;margin-bottom:6px}
h2 em{font-style:italic;color:var(--coral)}
.sub{font-size:1.15rem;color:var(--muted);margin-bottom:12px;max-width:980px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.card{background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:16px 20px}
.card h3{font-size:1.35rem;margin-bottom:4px}
.pill{display:inline-block;padding:2px 12px;border-radius:999px;font-weight:700;font-size:.85rem;background:#EFEAFB;color:var(--violet)}
.rv{cursor:pointer;position:relative;transition:transform .12s,border-color .2s}
.rv:hover{border-color:var(--violet)}
.rv .hid{display:none}
.rv.on .hid{display:block}
.rv.on .hide-on{display:none}
.rv .dot{position:absolute;right:14px;top:12px;color:var(--violet);font-size:1rem}
.rv.on .dot{display:none}
.hid{color:var(--teal);font-weight:600;margin-top:6px}
/* cover */
.cover{justify-content:center;align-items:flex-start;overflow:hidden}
.cover h1{font-size:4.4rem;line-height:1.02;margin:10px 0 18px}
.cover h1 em{color:var(--coral);font-style:italic}
.cover .by{font-size:1.4rem;color:var(--muted)}
.blobs{position:absolute;right:-90px;top:-70px;width:560px;height:560px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#FFE0B8,#F9B9A8 55%,transparent 72%);opacity:.8;pointer-events:none}
.blobs2{position:absolute;right:140px;bottom:-130px;width:380px;height:380px;border-radius:50%;background:radial-gradient(circle,#CFE9E6,transparent 70%);pointer-events:none}
/* hello */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:12px 0 18px}
.stat{background:#fff;border:1.5px solid var(--line);border-radius:16px;padding:14px 18px}
.stat b{display:block;font:700 2.3rem 'Fraunces',serif;color:var(--coral)}
.stat span{color:var(--muted);font-size:1rem}
.quote{font:600 1.6rem/1.35 'Fraunces',serif;max-width:900px}
/* plan timeline */
.tl{display:grid;gap:14px}
.tlrow{display:grid;grid-template-columns:150px 1fr;gap:18px;align-items:stretch}
.tlmin{border-radius:16px;color:#fff;font:700 2rem 'Fraunces',serif;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:10px}
.tlmin small{font:600 .85rem 'Outfit';letter-spacing:.1em}
.tlbody{background:#fff;border:1.5px solid var(--line);border-radius:16px;padding:12px 20px}
.tlbody h3{font-size:1.3rem}
.tlbody p{color:var(--muted);font-size:1.05rem}
/* scale rows */
.scale{display:grid;grid-template-columns:1fr auto;gap:14px;align-items:center;background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:10px 18px;margin-bottom:10px}
.scale .ed{min-height:1.7em;border-bottom:2px dashed var(--line);outline:none;padding:0 4px}.opts{display:flex;gap:6px}
.opts button{padding:6px 14px;border-radius:999px;background:#F1EBE2;font-weight:600;font-size:.95rem}
.opts button.on{background:var(--violet);color:#fff}
/* word cards */
.words{grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.word{padding:20px 14px;text-align:center}
.word b{font:700 1.55rem 'Fraunces',serif;display:block}
.word .hid{font-size:1.05rem;color:var(--teal);margin-top:4px}
/* mc */
.mcq{margin-bottom:6px}
.mcq .q{font-weight:700;font-size:1.15rem;margin-bottom:8px}
.mcq .o{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.mcq .o button{background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:10px 14px;text-align:left;font-size:1.05rem}
.mcq .o button.right{background:#E3F3EA;border-color:var(--ok)}
.mcq .o button.wrong{background:#FBE5E1;border-color:var(--bad)}
.mcq .fb{display:none;color:var(--ok);font-weight:600;margin-top:6px}
.mcq.done .fb{display:block}
/* spin / big card */
.big{background:#fff;border:2px solid var(--ink);border-radius:22px;padding:34px 42px;font:600 2.2rem/1.25 'Fraunces',serif;min-height:210px;display:flex;align-items:center;justify-content:center;text-align:center;box-shadow:8px 8px 0 var(--amber)}
.big small{display:block;font:600 1rem 'Outfit';color:var(--muted);margin-top:10px}
.act{margin:18px 0 0;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.btn{background:var(--coral);color:#fff;padding:12px 26px;border-radius:999px;font-weight:700;font-size:1.05rem}
.btn.alt{background:var(--ink)}
.steps{display:flex;gap:10px;margin-top:6px;flex-wrap:wrap}
.pickc{cursor:pointer;transition:.15s}.pickc:hover{border-color:var(--violet)}.pickc.sel{background:#EFEAFB;border-color:var(--violet);box-shadow:0 0 0 2px var(--violet) inset}.pickc.sel h3::after{content:' ✓';color:var(--violet)}.pickrow .step{cursor:pointer}.pickrow .step.sel{background:var(--ink);color:#fff;border-color:var(--ink)}.step{background:#fff;border:1.5px solid var(--line);border-radius:999px;padding:6px 16px;font-weight:600}
/* choose */
.vs{display:grid;grid-template-columns:1fr auto 1fr;gap:16px;align-items:center;margin-bottom:12px}
.vs .c{cursor:pointer;transition:.15s;background:#fff;border:1.5px solid var(--line);border-radius:16px;padding:16px 22px;font-size:1.25rem;font-weight:600;text-align:center}
.vs .c:hover{border-color:var(--coral)}.vs .c.sel{background:var(--ink);color:#fff;border-color:var(--ink)}.vs .or{font:700 1.1rem 'Fraunces',serif;color:var(--coral)}
/* mistakes */
.mist{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mist .rv{padding:14px 20px}
.mist .bad{font-size:1.3rem;font-weight:600;line-height:1.5}.mist .wrong{background:#FFD6D0;color:#7A1F14;padding:2px 10px;border-radius:8px;box-decoration-break:clone;-webkit-box-decoration-break:clone}.mist .x{color:var(--bad);font-weight:800;font-size:1.4rem;margin-left:6px}
.mist .why{font-size:.98rem;color:var(--muted);margin-top:2px}
/* checklist chips */
.chip{display:inline-block;background:#fff;border:1.5px solid var(--line);border-radius:999px;padding:6px 16px;margin:4px 6px 4px 0;font-weight:600}
.num{display:inline-flex;width:34px;height:34px;border-radius:50%;background:var(--ink);color:#fff;align-items:center;justify-content:center;font-weight:700;margin-right:10px;flex:none}
/* footer */
.foot{display:flex;align-items:center;gap:12px;padding:10px 22px;border-top:1px solid var(--line);background:#fff}
.secs{display:flex;gap:6px;flex:1;overflow:hidden}
.sec{flex:1;padding:5px 10px;border-radius:10px;background:#F1EBE2;font-weight:600;font-size:.85rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sec.on{background:var(--ink);color:#fff}
.sec.past{background:#DDEFEA;color:var(--teal)}
.nb{padding:8px 20px;border-radius:999px;background:var(--ink);color:#fff;font-weight:700}
.nb.ghost{background:#F1EBE2;color:var(--ink)}
.cnt{font-weight:700;min-width:64px;text-align:center;color:var(--muted)}
/* notes */
#notes{position:fixed;right:30px;bottom:80px;width:360px;background:#fff;border:1.5px solid var(--ink);border-radius:14px;box-shadow:6px 6px 0 rgba(27,42,51,.12);display:none;z-index:50}
#notes.on{display:block}
#notes .bar{display:flex;gap:6px;align-items:center;padding:8px 10px;border-bottom:1px solid var(--line);cursor:move;background:#F6F1E8;border-radius:12px 12px 0 0}
#notes .bar button{padding:2px 10px;border-radius:6px;background:#fff;border:1px solid var(--line);font-weight:700}
#notes .bar .sw{width:20px;height:20px;border-radius:50%;border:1px solid var(--line)}
#notes .ed{min-height:224px;max-height:392px;overflow:auto;padding:0 14px;font-size:1.1rem;outline:none;background-image:linear-gradient(transparent 31px,#D9D1C3 31px,#D9D1C3 32px);background-size:100% 32px;background-attachment:local;line-height:32px}
.msg{background:#fff;border:1.5px solid var(--line);border-radius:16px;padding:20px 28px;font-size:1.12rem;line-height:1.5;max-width:980px}
.msg [contenteditable]{outline:none;border-bottom:2px dashed var(--line)}
.msg li{margin-left:20px}
.hint{font-size:.95rem;color:var(--muted)}
.note{position:absolute;left:64px;right:64px;bottom:8px;font-size:.88rem;color:var(--muted);border-top:1px dashed var(--line);padding-top:6px}
.pr{align-items:stretch}.pc{background:#fff;border:1.5px solid var(--line);border-top:8px solid var(--c);border-radius:18px;padding:22px 26px}.pc .ic{width:62px;height:62px;border-radius:50%;background:color-mix(in srgb,var(--c) 14%,#fff);display:flex;align-items:center;justify-content:center;font-size:2rem;margin-bottom:10px}.pc h3{font-size:1.7rem;margin-bottom:8px}.pc .q{font-weight:700;color:var(--muted);margin:10px 0 6px}.pc p{margin:6px 0;font-size:1.25rem}.pc b{font-weight:700}mark{background:#FFE9A8;padding:0 6px;border-radius:6px;font-weight:700;color:var(--ink)}
.rd{display:grid;grid-template-columns:330px 1fr;gap:26px;align-items:start}.rdside{background:#F6E9D4;border-radius:18px;padding:20px 22px}.rdh{font:700 .72rem 'Outfit';letter-spacing:.14em;text-transform:uppercase;color:#9A6B12;margin-bottom:8px}.rdt{font-size:1.15rem;font-weight:500;padding:5px 0;border-bottom:1px dashed rgba(154,107,18,.3)}.rdt:last-child{border-bottom:none}.rdline{position:relative;display:grid;gap:10px}.rdline::before{content:'';position:absolute;left:22px;top:20px;bottom:20px;width:3px;background:var(--line);border-radius:2px}.rds{position:relative;display:flex;align-items:center;gap:18px;background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:10px 18px 10px 12px}.rdn{flex:none;width:44px;height:44px;border-radius:50%;color:#fff;font:700 1.3rem 'Fraunces',serif;display:flex;align-items:center;justify-content:center;z-index:1}.rdtt{font:700 1.35rem 'Fraunces',serif}.rdd{font-size:1.1rem;color:var(--muted)}
.hwcard{position:absolute;right:64px;top:50%;transform:translateY(-50%);width:360px;background:#fff;border:1.5px solid var(--line);border-top:8px solid var(--violet);border-radius:18px;padding:20px 24px;z-index:2;box-shadow:8px 8px 0 rgba(108,99,201,.12)}.hwk{font:700 .75rem 'Outfit';letter-spacing:.14em;text-transform:uppercase;color:var(--violet);margin-bottom:4px}.hwcard h3{font-size:1.5rem;margin-bottom:10px}.hwl{display:grid;gap:8px}.hwl a{display:flex;justify-content:space-between;text-decoration:none;color:var(--ink);background:#F6F1E8;border-radius:12px;padding:10px 16px;font-weight:600;font-size:1.1rem}.hwl a:hover{background:#EFEAFB}.hwl a span{color:var(--violet)}
</style></head><body>
<div class="app">
<header class="top">
  <div class="brand"><small>Trial lesson</small>with Teacher Nanda</div>
  <div class="grp"><span>Length</span><div class="seg" id="sLen"><button data-v="25">25 min</button><button data-v="50">50 min</button></div></div>

</div>
